[project]
name = "audioic"
version = "0.1.0"
description = "AudioIC Project"
authors = [{name = "Mathias Rose Bjare", email = "mathias@example.com"}]
license = {text = "CC BY-NC 4.0"}
requires-python = ">=3.11"

dependencies = [
    "music2latent",
    "numpy>=1.23.4,<2.0.0",
    "soundfile>=0.12.1",
    "torch>=2.3.0,<3.0.0",
    "torchaudio>=2.3.0,<3.0.0",
    "librosa>=0.10.2.post1",
    "x-transformers==1.42",
    "einops>=0.8.0",
    "jsonargparse[signatures]>=4.32.0,<5.0.0"
]

[project.optional-dependencies]
demo = [
    "ipykernel",
    "matplotlib"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
